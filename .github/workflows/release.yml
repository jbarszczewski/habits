name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the base64-encoded keystore stored as a GitHub variable (not a
      # secret — the .jks file is already committed to the repo) and write it
      # back as release.jks at the repo root (where build.gradle.kts expects it).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ vars.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      # Create keystore.properties: passwords come from secrets (sensitive),
      # alias comes from a variable (not sensitive).
      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ vars.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          renamed_path="app/build/outputs/apk/release/habits_${GITHUB_REF_NAME}.apk"
          mv "$apk_path" "$renamed_path"
          echo "path=$renamed_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
